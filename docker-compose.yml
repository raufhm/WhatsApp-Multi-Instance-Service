version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: whatsapp-db
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
      POSTGRES_DB: whatsapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: whatsapp-app
    ports:
      - "8080:8080"
    environment:
      PG_DSN: "postgres://whatsapp:whatsapp@db:5432/whatsapp?sslmode=disable"
      PORT: "8080"
      S3_BUCKET: ""
      BOT_SESSION_TIMEOUT: "30m"
      BOT_FALLBACK_REPLY: "I'm sorry, I didn't understand that."
      BOT_RULES_VERSION: "default"
      LOG_LEVEL: "INFO"
      UPLOAD_WORKER_ENABLED: "true"
      UPLOAD_POLL_INTERVAL: "5s"
      UPLOAD_MAX_ATTEMPTS: "5"
      UPLOAD_INITIAL_BACKOFF: "1s"
      UPLOAD_MAX_BACKOFF: "60s"
      UPLOAD_LEASE: "60s"
      UPLOAD_JITTER: "0.2"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - whatsapp_sessions:/app/sessions
    # The image ENTRYPOINT runs migrations and then execs CMD (./whatsapp-service)

volumes:
  postgres_data:
  whatsapp_sessions:
