version: "3.8"

services:
  app:
    build: .
    container_name: whatsapp-app
    ports:
      - "8080:8080"
    environment:
      # PG_DSN must be exported in your shell (e.g. .zshrc). No .env file is used.
      PG_DSN: "${PG_DSN}"
      APP_ENV: "dev"
      PORT: "8080"
      S3_BUCKET: "${S3_BUCKET}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_REGION: "${S3_REGION}"
      S3_OBJECT_URL: "${S3_OBJECT_URL}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      BOT_SESSION_TIMEOUT: "30m"
      BOT_FALLBACK_REPLY: ""
      BOT_RULES_VERSION: "default"
      LOG_LEVEL: "INFO"
      UPLOAD_WORKER_ENABLED: "true"
      UPLOAD_POLL_INTERVAL: "5s"
      UPLOAD_MAX_ATTEMPTS: "5"
      UPLOAD_INITIAL_BACKOFF: "1s"
      UPLOAD_MAX_BACKOFF: "60s"
      UPLOAD_LEASE: "60s"
      UPLOAD_JITTER: "0.2"
    volumes:
      - whatsapp_sessions:/app/sessions

volumes:
  whatsapp_sessions:
